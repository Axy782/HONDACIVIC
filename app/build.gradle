plugins { id 'com.android.application' }

android {
    namespace 'com.sistemadesglose.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.sistemadesglose.app"
        minSdk 24
        targetSdk 34
        // v100 FIX DEFINITIVO: usar timestamp Unix como versionCode.
        // Un timestamp actual (~1.7 mil millones) SIEMPRE es mayor que cualquier
        // versionCode que hayas tenido antes. Así, todo build nuevo se puede
        // instalar encima sin problema — no más "versión más vieja".
        versionCode ((int)(System.currentTimeMillis() / 1000))
        versionName System.getenv("APK_BUILD_NUMBER") ? "1." + System.getenv("APK_BUILD_NUMBER") : "1.0"
    }

    signingConfigs {
        jfv {
            storeFile file("../desglose-key.jks")
            storePassword "eurojfv2026"
            keyAlias "jfv"
            keyPassword "eurojfv2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.jfv
        }
        debug {
            signingConfig signingConfigs.jfv
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { }
