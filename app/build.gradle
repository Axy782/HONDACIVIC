plugins {
    id 'com.android.application'
}

android {
    namespace 'com.euroaluminio.reproductor'
    compileSdk 34

    defaultConfig {
        applicationId "com.euroaluminio.reproductor"
        minSdk 16
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Seguridad TLS moderna dentro de la app (como hace Poweramp) para que el radio viejo
    // pueda conectar a servidores actuales. Versión 2.1.0: reportada funcionando en Android 4.1-4.2 (API 16-17).
    implementation 'org.conscrypt:conscrypt-android:2.1.0'
    // Generar código QR sin internet (compatible con Android viejo)
    implementation 'com.google.zxing:core:3.3.0'
}
